[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-analyst"
version = "0.1.0"
description = "AI Analyst over multi-quarter opportunity snapshot data"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.6.0",
]
# The planner's model adapter (agent/planner/anthropic_adapter.py). Optional:
# the deterministic engine and the default test suite never need it.
llm = [
    "anthropic>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes noticeably longer than the rest of the suite (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
